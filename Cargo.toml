[package]
name = "hannoy"
description = "HNSW Approximate Nearest Neighbors in Rust, based on LMDB and optimized for memory usage"
version = "0.2.1"
repository = "https://github.com/nnethercott/hannoy"
keywords = [
    "HNSW",
    "Graph-algorithms",
    "Vector-Search",
    "Store",
    "Nearest-Neighbours",
]
categories = ["algorithms", "database", "data-structures", "science"]
authors = [
    "Kerollmops <clement@meilisearch.com>",
    "Tamo <tamo@meilisearch.com>",
    "Nate <natenethercott@gmail.com>",
]
license = "MIT"
edition = "2021"

[lib]
name = "hannoy"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
byteorder = "1.5.0"
hashbrown = "0.17.1"
heed = { version = "0.22.1", default-features = false }
min-max-heap = "1.3.0"
page_size = "0.6.0"
papaya = "0.2.4"
rand = { version = "0.10.2", features = ["alloc"] }
rayon = "1.12.0"
roaring = "0.11.4"
rustc-hash = "2.1.3"
thiserror = "2.0.20"
tinyvec = { version = "1.12.0", features = ["rustc_1_55"] }
tracing = "0.1.44"
steppe = { version = "0.4", default-features = false }
pyo3 = { version = "0.29.2", optional = true, features = ["either"] }
pyo3-stub-gen = { version = "0.23.0", optional = true }
either = { version = "1.17", optional = true }
once_cell = { version = "1.21.4", optional = true }
tempfile = { version = "3.27.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
numpy = { version = "0.29.0", optional = true }
thread_local = "1.1.10"
crossbeam-channel = "0.5.16"

[target.'cfg(not(windows))'.dependencies]
madvise = "0.1.0"

[dev-dependencies]
anyhow = "1.0.104"
approx = "0.5.1"
arbitrary = { version = "1.4.2", features = ["derive"] }
arroy = { version = "0.8.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
divan = { version = "3.0.5", package = "codspeed-divan-compat" }
hnsw_rs = "0.3.4"
insta = "1.48.0"
instant-distance = "0.6.1"
proptest = "1.11.0"
rand = { version = "0.10.2", features = ["std_rng"] }
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []

# Enabling this feature allows dumpless upgrades from arroy to hannoy
arroy = []

# Enabling this feature provide a method on the reader that assert its own validity.
assert-reader-validity = []

# Enabling this feature allows using the crate from Python.
python = ["dep:pyo3", "pyo3-stub-gen", "pyo3-stub-gen/numpy", "dep:numpy", "either", "once_cell", "parking_lot"]
extension-module = ["python", "pyo3/extension-module"]

[profile.dev]
opt-level = 3

[[bin]]
name = "stub_gen"
path = "./src/bin/stub_gen.rs"
required-features = ["python"]


[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "speed"
harness = false
